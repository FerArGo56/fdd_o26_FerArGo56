hor="middle">cantidad</text><rect x="345.33333333333337" y="240" width="114.66666666666667" height="80" rx="4" fill="#7ef29d" fill-opacity="0.3" stroke="#7ef29d" stroke-width="1.2"/><text x="402.6666666666667" y="232" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">precio</text><text x="280" y="356" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">memoria en columnas (Arrow): una sola copia</text><text x="650" y="150" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Polars</text><rect x="570" y="160" width="160" height="170" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><rect x="580.0" y="190" width="41.333333333333336" height="130" rx="4" fill="#6fd8e8" fill-opacity="0.3" stroke="#6fd8e8" stroke-width="1.2"/><text x="600.6666666666666" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">tienda</text><rect x="629.3333333333334" y="190" width="41.333333333333336" height="130" rx="4" fill="#6fd8e8" fill-opacity="0.3" stroke="#6fd8e8" stroke-width="1.2"/><text x="650.0" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">cantidad</text><rect x="678.6666666666666" y="190" width="41.333333333333336" height="130" rx="4" fill="#6fd8e8" fill-opacity="0.3" stroke="#6fd8e8" stroke-width="1.2"/><text x="699.3333333333333" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">precio</text><line x1="736" y1="230" x2="864" y2="230" stroke="#ff8a7a" stroke-width="2.2" marker-end="url(#fff8a7a)"/><rect x="742.0" y="190" width="116" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="800" y="209" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">to_pandas()</text><line x1="864" y1="270" x2="736" y2="270" stroke="#ff8a7a" stroke-width="2.2" marker-end="url(#fff8a7a)"/><rect x="738.0" y="282" width="124" height="28" rx="6" fill="#0b0f12" stroke="#ff8a7a" stroke-width="1.2"/><text x="800" y="301" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">pl.from_pandas()</text><text x="950" y="132" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">pandas</text><text x="950" y="150" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">NumPy por dentro</text><rect x="870" y="160" width="160" height="170" rx="10" fill="#141b20" stroke="#ff8a7a" stroke-width="2"/><rect x="880.0" y="190" width="41.333333333333336" height="130" rx="4" fill="#ff8a7a" fill-opacity="0.3" stroke="#ff8a7a" stroke-width="1.2"/><text x="900.6666666666666" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">tienda</text><rect x="929.3333333333334" y="190" width="41.333333333333336" height="130" rx="4" fill="#ff8a7a" fill-opacity="0.3" stroke="#ff8a7a" stroke-width="1.2"/><text x="950.0" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">cantidad</text><rect x="978.6666666666666" y="190" width="41.333333333333336" height="130" rx="4" fill="#ff8a7a" fill-opacity="0.3" stroke="#ff8a7a" stroke-width="1.2"/><text x="999.3333333333333" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">precio</text><text x="800" y="356" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cada paso convierte: los datos, dos veces en memoria</text><text x="540.0" y="414" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Arrow es un formato de columnas en memoria: Polars y DuckDB lo leen sin convertir; pandas no.</text></svg>