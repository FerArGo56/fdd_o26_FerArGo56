<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-label="Cuatro capas en fila unidas por flechas. Proyecto: uv, ruff y pytest, como se instala y se revisa. Contratos: tipos y Pydantic, quien revisa cada dato. Motor: Polars y DuckDB, donde se hace el trabajo. Formato: Parquet, como se guarda. Debajo de cada capa, en gris, lo viejo que suele escribir la IA en su lugar: pip y requirements.txt; sin tipos o Pydantic v1; pandas para todo; CSV o pickle"><rect x="0" y="0" width="1080" height="420" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El stack en cuatro capas</text><rect x="40" y="90" width="220" height="140" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="150.0" y="122" fill="#ffc857" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">proyecto</text><text x="150.0" y="166" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">uv · ruff · pytest</text><text x="150.0" y="206" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cómo se instala y se revisa</text><line x1="264" y1="160" x2="296" y2="160" stroke="#4a7a63" stroke-width="2.2" marker-end="url(#f4a7a63)"/><rect x="60" y="296" width="180" height="70" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.6" stroke-dasharray="8 6"/><text x="150.0" y="324" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">pip</text><text x="150.0" y="348" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">requirements.txt</text><rect x="300" y="90" width="220" height="140" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="410.0" y="122" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">contratos</text><text x="410.0" y="166" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">tipos · Pydantic</text><text x="410.0" y="206" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">quién revisa cada dato</text><line x1="524" y1="160" x2="556" y2="160" stroke="#4a7a63" stroke-width="2.2" marker-end="url(#f4a7a63)"/><rect x="320" y="296" width="180" height="70" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.6" stroke-dasharray="8 6"/><text x="410.0" y="324" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">sin tipos</text><text x="410.0" y="348" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">Pydantic v1</text><rect x="560" y="90" width="220" height="140" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="670.0" y="122" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">motor</text><text x="670.0" y="166" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">Polars · DuckDB</text><text x="670.0" y="206" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">dónde se hace el trabajo</text><line x1="784" y1="160" x2="816" y2="160" stroke="#4a7a63" stroke-width="2.2" marker-end="url(#f4a7a63)"/><rect x="580" y="296" width="180" height="70" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.6" stroke-dasharray="8 6"/><text x="670.0" y="336" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">pandas para todo</text><rect x="820" y="90" width="220" height="140" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="930.0" y="122" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">formato</text><text x="930.0" y="166" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">Parquet</text><text x="930.0" y="206" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cómo se guarda</text><rect x="840" y="296" width="180" height="70" rx="10" fill="none" stroke="#a7b8ad" stroke-width="1.6" stroke-dasharray="8 6"/><text x="930.0" y="324" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">CSV</text><text x="930.0" y="348" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">pickle</text><text x="40" y="280" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">lo viejo que suele escribir la IA en cada capa:</text><text x="540.0" y="400" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cada capa se elige midiendo, no por costumbre.</text></svg>