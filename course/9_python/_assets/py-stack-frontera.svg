<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-label="Cuatro zonas de izquierda a derecha. Afuera: un CSV, una API y un formulario, datos en los que no confias. Una flecha entra a la frontera, donde Pydantic valida cada dato. Las filas validas pasan adentro, donde una dataclass o un TypedDict las lleva sin revisarlas de nuevo, y de ahi a tu codigo, que confia. Debajo de la frontera, una fila sucia con precio igual a abc sale rechazada con ValidationError y nunca entra"><rect x="0" y="0" width="1080" height="460" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="44" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Valida en la frontera, confía adentro</text><text x="140" y="92" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">afuera: no confías</text><rect x="50" y="112" width="180" height="46" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="140" y="141" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">CSV</text><rect x="50" y="174" width="180" height="46" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="140" y="203" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">API</text><rect x="50" y="236" width="180" height="46" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="140" y="265" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">formulario</text><line x1="234" y1="205" x2="300" y2="205" stroke="#a7b8ad" stroke-width="2.2" marker-end="url(#fa7b8ad)"/><rect x="304" y="100" width="200" height="210" rx="10" fill="#16302a" stroke="#6fd8e8" stroke-width="2.5"/><text x="404" y="92" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">la frontera</text><text x="404" y="196" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">Pydantic</text><text x="404" y="222" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">valida cada dato</text><text x="404" y="244" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una vez</text><line x1="508" y1="205" x2="576" y2="205" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><text x="542" y="190" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">válida</text><text x="690" y="92" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">adentro: confías</text><rect x="580" y="100" width="220" height="210" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="690" y="186" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">dataclass</text><text x="690" y="212" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" text-anchor="middle">TypedDict</text><text x="690" y="244" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">no revisa de nuevo</text><line x1="804" y1="205" x2="856" y2="205" stroke="#7ef29d" stroke-width="2.2" marker-end="url(#f7ef29d)"/><rect x="860" y="170" width="180" height="70" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="950" y="211" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">tu código</text><line x1="404" y1="314" x2="404" y2="362" stroke="#ff8a7a" stroke-width="2.2" marker-end="url(#fff8a7a)"/><rect x="294" y="366" width="220" height="46" rx="8" fill="#0b0f12" stroke="#ff8a7a" stroke-width="2"/><text x="404" y="395" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="middle">ValidationError</text><text x="540" y="386" fill="#ff8a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">precio = "abc"</text><text x="540" y="408" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la fila sucia se rechaza aquí y nunca entra</text></svg>