name: Revisión de entrega

# Revisa los pull requests de estudiantes: que toquen sólo su propia carpeta,
# que esa carpeta se llame exactamente como su login, que no traigan basura y
# que no vengan de la rama default de su fork.
#
# `pull_request_target` y NO `pull_request`. Con `pull_request`, GitHub corre el
# workflow y los archivos del merge ref: el propio pull request puede reescribir
# este archivo y el script que lo juzga, y aprobarse solo. `pull_request_target`
# los toma de la rama base.
#
# El precio de ese disparador es que NUNCA se debe ejecutar código del pull
# request. Por eso el checkout va fijado a `base.sha`, sin credenciales, y el
# script sólo consulta la API: no lee ni corre nada del árbol de trabajo.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision:
    # Los bots no tienen carpeta de estudiante: rechazarlos sería un falso
    # positivo permanente en cada actualización de dependencias.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Revisar la entrega
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          RAMA: ${{ github.event.pull_request.head.ref }}
          RAMA_DEFAULT: ${{ github.event.pull_request.head.repo.default_branch }}
          MANTENEDORES: uumami
          # La regla de la branch solo AVISA hasta esta fecha, y a partir de
          # ella rechaza. Existe porque el grupo ya tenia pull requests
          # abiertos desde main cuando la regla entro. Cubre la entrega del
          # 10 de septiembre y la de DataCamp del 17. Para endurecerla ya,
          # borra esta linea.
          BRANCH_ESTRICTA_DESDE: "2026-09-18"
        run: python3 .github/scripts/revisa_entrega.py
